server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Typed evaluation API -> units service on the compose network
    location /api/ {
        proxy_pass http://units:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        proxy_pass http://units:8080/healthz;
    }
}
